<div class="mb-6 flex flex-col gap-4 sm:flex-row sm:items-center sm:justify-between">
  <div>
    <h1 class="text-2xl font-semibold text-foreground">Cuarteles</h1>
    <p class="mt-1 text-sm text-muted">Organiza los cuarteles asociados a cada fundo.</p>
  </div>
  <button
    type="button"
    (click)="createBlock()"
    class="inline-flex h-8 items-center gap-1.5 rounded-lg bg-primary px-2.5 text-sm font-medium text-primary-foreground hover:bg-primary/80"
  >
    <svg lucidePlus class="size-4" aria-hidden="true"></svg>
    Nuevo cuartel
  </button>
</div>

@if (errorMessage()) {
  <div
    class="mb-4 rounded-lg border border-red-500/30 bg-red-500/10 px-4 py-3 text-sm text-red-400"
  >
    {{ errorMessage() }}
  </div>
}

<custom-table
  [headers]="headers()"
  [data]="blocks()"
  [pageSize]="pageSize()"
  searchPlaceholder="Buscar cuarteles..."
  emptyMessage="No hay cuarteles registrados."
>
  <ng-template appTableRow let-block>
    <tr class="border-b border-border transition-colors last:border-0 hover:bg-muted/50">
      <td class="px-2 py-2.5 font-medium text-foreground">{{ block.name }}</td>
      <td class="px-2 py-2.5 text-muted">{{ block.surface }}</td>
      <td class="px-2 py-2.5 text-muted">{{ block.unit }}</td>
      <td class="px-2 py-2.5 text-muted">{{ landName(block.landId) }}</td>
      <td class="px-2 py-2.5">
        <button
          type="button"
          (click)="viewBlock(block)"
          class="inline-flex size-8 items-center justify-center rounded-lg text-muted-foreground hover:bg-muted hover:text-foreground"
          [attr.aria-label]="'Ver ' + block.name"
        >
          <svg lucideEye class="size-4" aria-hidden="true"></svg>
        </button>
        <button
          type="button"
          (click)="editBlock(block)"
          class="inline-flex size-8 items-center justify-center rounded-lg text-muted-foreground hover:bg-muted hover:text-foreground"
          [attr.aria-label]="'Editar ' + block.name"
        >
          <svg lucideSquarePen class="size-4" aria-hidden="true"></svg>
        </button>
      </td>
    </tr>
  </ng-template>
</custom-table>

@if (detailData().length > 0) {
  <modal [isOpen]="isViewOpen()" [data]="detailData()" (isClose)="closeView($event)" />
}
