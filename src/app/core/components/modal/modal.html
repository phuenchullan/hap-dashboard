<dialog [open]="isOpen()"
    class="bg-secondary m-auto h-fit rounded-lg p-0 shadow-lg backdrop:bg-black/50 backdrop:backdrop-blur-9xl fixed top-0 left-0 right-0 bottom-0 p-4 w-[80%]">
    <div class="flex justify-end mt-1">
        <button class="bg-primary text-primary-foreground px-2 py-1 rounded-lg" (click)="closeModal()">
            <svg lucideX class="size-4" aria-hidden="true"></svg>
        </button>
    </div>
    <div class="grid grid-cols-1 gap-5 sm:grid-cols-2">
        @for (item of data(); track item.key) {
            <div class="flex flex-col">
                <label data-slot="label"
                    class="items-center gap-2 font-medium select-none group-data-[disabled=true]:pointer-events-none group-data-[disabled=true]:opacity-50 peer-disabled:cursor-not-allowed peer-disabled:opacity-50 mb-1.5 block text-sm"
                    for="Rut">
                    {{ item.key }}
                </label>
                <h1 class="text-foreground text-lg font-medium">
                    {{ item.value }}
                </h1>
            </div>
        }
    </div>
</dialog>
