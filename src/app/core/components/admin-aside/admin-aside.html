      }

        @for (item of tagIcons(); track item.link; let index = $index) {
          <li [class]="styleSidebar()">
            <aside-item
              [tag]="item.tag"
              [itemSelected]="item.selected"
              [icon]="item.icon"
              [index]="index"
              [link]="item.link"
              (changeSelected)="onChangeSelected($event)"
              [isOpenSidebar]="isOpenSidebar()"
            />
          </li>
        }
