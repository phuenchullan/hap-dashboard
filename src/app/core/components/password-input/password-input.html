<div class="flex">
    <input data-slot="input" [type]="passwordVisibility()"
        class="h-8 w-full min-w-0 rounded-lg border border-input bg-transparent px-2.5 py-1 text-base transition-colors outline-none file:inline-flex file:h-6 file:border-0 file:bg-transparent file:text-sm file:font-medium file:text-foreground placeholder:text-muted-foreground focus-visible:border-ring focus-visible:ring-3 focus-visible:ring-ring/50 disabled:pointer-events-none disabled:cursor-not-allowed disabled:bg-input/50 disabled:opacity-50 aria-invalid:border-destructive aria-invalid:ring-3 aria-invalid:ring-destructive/20 md:text-sm dark:bg-input/30 dark:disabled:bg-input/80 dark:aria-invalid:border-destructive/50 dark:aria-invalid:ring-destructive/40 pr-8" placeholder="Password(rut - sin dígito verificador)" [value]="value()"
        (input)="value.set($event.target.value)" />
    <button (click)="togglePasswordVisibility()" class="relative right-6 top-4 -translate-y-1/2" type="button">
        @if(passwordVisibility() === 'password'){
            <svg lucideEye class="size-4" aria-hidden="true"></svg>
        }@else {
            <svg lucideEyeOff class="size-4" aria-hidden="true"></svg>
        }
    </button>
</div>
