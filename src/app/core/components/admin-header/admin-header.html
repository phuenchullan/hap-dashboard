<header
    class="glass-overlay sticky top-0 z-30 flex h-16 items-center justify-between gap-4 border-b border-divider px-1">
    <div class="flex items-center gap-1">
        <button data-slot="button" (click)="onToggleSidebar()" data-variant="ghost" data-size="icon"
            class="group/button shrink-0 items-center justify-center rounded-lg border border-transparent bg-clip-padding text-sm font-medium whitespace-nowrap transition-all outline-none select-none focus-visible:border-ring focus-visible:ring-3 focus-visible:ring-ring/50 active:not-aria-[haspopup]:translate-y-px disabled:pointer-events-none disabled:opacity-50 aria-invalid:border-destructive aria-invalid:ring-3 aria-invalid:ring-destructive/20 dark:aria-invalid:border-destructive/50 dark:aria-invalid:ring-destructive/40 [&amp;_svg]:pointer-events-none [&amp;_svg]:shrink-0 [&amp;_svg:not([class*='size-'])]:size-4 hover:bg-muted hover:text-foreground aria-expanded:bg-muted aria-expanded:text-foreground dark:hover:bg-muted/50 size-8 hidden lg:flex"
            aria-label="Toggle sidebar">
            @if (isOpenSidebar()) {
              <svg lucidePanelLeftClose class="size-4" aria-hidden="true"></svg>
            }@else{
              <svg lucidePanelLeftOpen class="size-4" aria-hidden="true"></svg>
            }
        </button>
        <button data-slot="button" data-variant="ghost" data-size="icon"
          class="group/button inline-flex shrink-0 items-center justify-center rounded-lg border border-transparent bg-clip-padding text-sm font-medium whitespace-nowrap transition-all outline-none select-none focus-visible:border-ring focus-visible:ring-3 focus-visible:ring-ring/50 active:not-aria-[haspopup]:translate-y-px disabled:pointer-events-none disabled:opacity-50 aria-invalid:border-destructive aria-invalid:ring-3 aria-invalid:ring-destructive/20 dark:aria-invalid:border-destructive/50 dark:aria-invalid:ring-destructive/40 [&amp;_svg]:pointer-events-none [&amp;_svg]:shrink-0 [&amp;_svg:not([class*='size-'])]:size-4 hover:bg-muted hover:text-foreground aria-expanded:bg-muted aria-expanded:text-foreground dark:hover:bg-muted/50 size-8 lg:hidden" aria-label="Open menu">
          <svg lucideMenu class="size-4" aria-hidden="true"></svg>
        </button>
        <nav aria-label="breadcrumb" data-slot="breadcrumb" class="ml-1">
          <ol data-slot="breadcrumb-list"
            class="flex flex-wrap items-center gap-1.5 text-sm wrap-break-word text-muted-foreground">
            <li data-slot="breadcrumb-item" class="inline-flex items-center gap-1">
              <span data-slot="breadcrumb-page" role="link" aria-disabled="true" aria-current="page"
                class="font-normal text-foreground">{{ section() }}
              </span>
            </li>
          </ol>
        </nav>
    </div>
    <div class="flex items-center gap-1">
        <button 
            (click)="onToggleDarkMode()"
        data-slot="button" data-variant="ghost" data-size="icon"
            class="group/button inline-flex shrink-0 items-center justify-center rounded-lg border border-transparent bg-clip-padding text-sm font-medium whitespace-nowrap transition-all outline-none select-none focus-visible:border-ring focus-visible:ring-3 focus-visible:ring-ring/50 active:not-aria-[haspopup]:translate-y-px disabled:pointer-events-none disabled:opacity-50 aria-invalid:border-destructive aria-invalid:ring-3 aria-invalid:ring-destructive/20 dark:aria-invalid:border-destructive/50 dark:aria-invalid:ring-destructive/40 [&amp;_svg]:pointer-events-none [&amp;_svg]:shrink-0 [&amp;_svg:not([class*='size-'])]:size-4 hover:bg-muted hover:text-foreground aria-expanded:bg-muted aria-expanded:text-foreground dark:hover:bg-muted/50 size-8"
            aria-label="Toggle color mode">
            @if (!isDarkMode()) {
              <svg lucideMoon class="size-4" aria-hidden="true"></svg>
            }@else{
              <svg lucideSun class="size-4" aria-hidden="true"></svg>
            }
        </button>
        <button type="button" id="dropdownInformationButton" data-dropdown-toggle="dropdownInformation" (click)="isDropdownOpen.set(!isDropdownOpen())" [class]="styleButtonDropdown()">
            <span
            data-slot="avatar" data-size="default"
            class="group/avatar relative flex shrink-0 rounded-full select-none after:absolute after:inset-0 after:rounded-full after:border after:border-border after:mix-blend-darken data-[size=lg]:size-10 data-[size=sm]:size-6 dark:after:mix-blend-lighten size-8 ring-2 ring-[var(--hap-divider)]">
                <img
                data-slot="avatar-image" width="32" height="37" class="aspect-square rounded-full object-cover"
                [ngSrc]="imageProfile()" />
            </span>
            <span class="ml-2 mr-1 hidden text-sm font-medium md:block">
              {{ user().name }} {{ user().lastname }}    
            </span> 
            <svg lucideChevronDown class="hidden size-4 text-[var(--hap-text-secondary)] md:block"
            aria-hidden="true"></svg>
        </button>
        <div class="fixed z-index-50 right-5 top-13 bg-secondary rounded-xl" [class.hidden]="!isDropdownOpen()">
            <div class="p-2">
                <div class="flex items-center px-2.5 p-2 space-x-1.5 text-sm bg-neutral-secondary-strong rounded">
                  <img class="rounded-full" width="32" height="37" [ngSrc]="imageProfile()" loading="lazy" alt="Rounded avatar" />
                  <div class="text-sm">
                    <div class="font-medium text-heading">{{ user().name }} {{ user().lastname }}</div>
                    <div class="truncate text-body">{{ user().email }}</div>
                  </div>
                  <span class="bg-brand-softer border border-brand-subtle text-fg-brand-strong text-xs font-medium px-1.5 py-0.5 rounded ms-auto">{{ user().role }}</span>
                </div>
              </div>
              <ul class="px-2 pb-2 text-sm text-body font-medium" aria-labelledby="dropdownInformationButton">
                <li>
                  <a [routerLink]="['/users', user().id]" class="inline-flex items-center w-full p-2 hover:bg-neutral-tertiary-medium hover:text-heading rounded">
                    <svg class="w-4 h-4 me-1.5" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="none" viewBox="0 0 24 24"><path stroke="currentColor" stroke-width="2" d="M7 17v1a1 1 0 0 0 1 1h8a1 1 0 0 0 1-1v-1a3 3 0 0 0-3-3h-4a3 3 0 0 0-3 3Zm8-9a3 3 0 1 1-6 0 3 3 0 0 1 6 0Z"/></svg>
                    Profile
                  </a>
                </li>
                <!-- <li>
                  <a href="#" class="inline-flex items-center w-full p-2 hover:bg-neutral-tertiary-medium hover:text-heading rounded">
                    <svg class="w-4 h-4 me-1.5" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="none" viewBox="0 0 24 24"><path stroke="currentColor" stroke-width="2" d="M7 17v1a1 1 0 0 0 1 1h8a1 1 0 0 0 1-1v-1a3 3 0 0 0-3-3h-4a3 3 0 0 0-3 3Zm8-9a3 3 0 1 1-6 0 3 3 0 0 1 6 0Z"/></svg>
                    Profile
                  </a>
                </li>
                <li>
                  <a href="#" class="inline-flex items-center w-full p-2 hover:bg-neutral-tertiary-medium hover:text-heading rounded">
                    <svg class="w-4 h-4 me-1.5" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="none" viewBox="0 0 24 24"><path stroke="currentColor" stroke-linecap="round" stroke-width="2" d="M20 6H10m0 0a2 2 0 1 0-4 0m4 0a2 2 0 1 1-4 0m0 0H4m16 6h-2m0 0a2 2 0 1 0-4 0m4 0a2 2 0 1 1-4 0m0 0H4m16 6H10m0 0a2 2 0 1 0-4 0m4 0a2 2 0 1 1-4 0m0 0H4"/></svg>
                    Settings
                  </a>
                </li> -->
                <li>
                  <button (click)="signOut()" class="inline-flex items-center w-full p-2 text-red-500 hover:bg-neutral-tertiary-medium rounded">
                    <svg class="w-4 h-4 me-1.5 text-red-500" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="none" viewBox="0 0 24 24"><path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20 12H8m12 0-4 4m4-4-4-4M9 4H7a3 3 0 0 0-3 3v10a3 3 0 0 0 3 3h2"/></svg>
                    Sign out
                  </button>
                </li>
              </ul>
        </div>
    </div>
</header>
